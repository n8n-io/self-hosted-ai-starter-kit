# Emergency rollback for the preserved PostgreSQL 16 volume.
# Use only as the final override file and never combine with `down -v`.
services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      PGDATA: /var/lib/postgresql/data
    volumes: !override
      - postgres_storage:/var/lib/postgresql/data
