x-base: &base
  security_opt:
    - no-new-privileges=true

x-n8n: &n8n
  image: docker.n8n.io/n8nio/n8n:${N8N_VERSION}

x-n8n-env: &n8n-env
  GENERIC_TIMEZONE: "Europe/Berlin"
  TZ: "Europe/Berlin"
  N8N_LOG_LEVEL: info
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: true
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?}
  N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET:?}

x-n8n-env-hosting: &n8n-env-hosting
  N8N_PROTOCOL: https
  N8N_HOST: n8n.${DOMAIN:?}
  WEBHOOK_URL: https://n8n.${DOMAIN:?}
  N8N_PORT: 5678
  N8N_SECURE_COOKIE: true

x-n8n-env-license: &n8n-env-license
  N8N_LICENSE_TENANT_ID: ${N8N_LICENSE_TENANT_ID:-1001}
  N8N_LICENSE_ACTIVATION_KEY: ${N8N_LICENSE_ACTIVATION_KEY:?}

x-n8n-env-postgres: &n8n-env-postgres
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE:-n8n}
  DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER:?}
  DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD:?}
  # POSTGRES_NON_ROOT_USER: ${POSTGRES_NON_ROOT_USER:?}
  # POSTGRES_NON_ROOT_PASSWORD: ${POSTGRES_NON_ROOT_PASSWORD:?}

x-n8n-env-runners: &n8n-env-runners
  N8N_RUNNERS_MODE: external
  N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?}
  N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
  N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679

x-n8n-health: &n8n-health
  healthcheck:
    test: [ "CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz/readiness" ]
    start_interval: 3s
    start_period: 30s
    interval: 10s
    timeout: 5s
    retries: 5

name: n8n
services:
  n8n:
    volumes:
      - ./.volumes/data/.n8n:/home/node/.n8n
    environment:
      <<: [ *n8n-env, *n8n-env-hosting, *n8n-env-license, *n8n-env-postgres, *n8n-env-runners ]
    networks:
      - n8n
      - postgres
      - vault
    labels:
      - traefik.enable=true
    <<: [ *base, *n8n, *n8n-health ]

  n8n-runner:
    image: n8nio/runners:${N8N_VERSION}
    depends_on:
      n8n:
        condition: service_healthy
        restart: true
    environment:
      <<: [ *n8n-env-runners ]
      N8N_RUNNERS_LAUNCHER_LOG_LEVEL: ${N8N_RUNNERS_LAUNCHER_LOG_LEVEL:-info}
    networks:
      - n8n
    restart: on-failure

networks:
  n8n:
    external: true
  postgres:
    external: true
  redis:
    external: true
  vault:
    external: true
