# N8N_VARIANT=build: postgres and the external task runner on top of ./docker-compose.yml, see ../../SPEC.md
x-n8n-env-postgres: &n8n-env-postgres
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE:-n8n}
  DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER:?}
  DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD:?}

x-n8n-env-runners-broker: &n8n-env-runners-broker
  N8N_RUNNERS_MODE: external
  N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?}
  N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0

# Code node imports, passed to the runners through ./n8n-task-runners.json; the JavaScript defaults repeat ./docker-compose.yml, see ../../SPEC.md
x-n8n-env-runners-code-allow: &n8n-env-runners-code-allow
  NODE_FUNCTION_ALLOW_BUILTIN: ${NODE_FUNCTION_ALLOW_BUILTIN:-crypto,buffer,url,util,path,events,stream,zlib,assert}
  NODE_FUNCTION_ALLOW_EXTERNAL: ${NODE_FUNCTION_ALLOW_EXTERNAL:-moment,luxon,lodash,nanoid}
  N8N_RUNNERS_STDLIB_ALLOW: ${N8N_RUNNERS_STDLIB_ALLOW:-json,re,datetime,time,math,random,statistics,decimal,collections,itertools,functools,string,textwrap,uuid,base64,hashlib,hmac,urllib,typing,dataclasses,enum,copy}
  N8N_RUNNERS_EXTERNAL_ALLOW: ${N8N_RUNNERS_EXTERNAL_ALLOW:-}

x-n8n-env-runners-launcher: &n8n-env-runners-launcher
  N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?}
  N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
  N8N_RUNNERS_LAUNCHER_LOG_LEVEL: ${N8N_RUNNERS_LAUNCHER_LOG_LEVEL:-info}

name: n8n
services:
  n8n:
    environment:
      <<: [ *n8n-env-postgres, *n8n-env-runners-broker ]
    extends:
      file: ./docker-compose.yml
      service: n8n

  n8n-runner:
    image: n8nio/runners:${N8N_VERSION:?}
    depends_on:
      n8n:
        condition: service_healthy
        restart: true
    volumes:
      # the launcher config of the image with the allowlists passed through, see ../../SPEC.md
      - ./n8n-task-runners.json:/etc/n8n-task-runners.json:ro
    environment:
      <<: [ *n8n-env-runners-launcher, *n8n-env-runners-code-allow ]
    networks:
      - n8n-starter-private
    restart: unless-stopped
    # the health check server of the launcher, see ../../SPEC.md
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:5680/healthz" ]
      start_interval: 3s
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges=true

networks:
  n8n-starter-public:
    external: true
  n8n-starter-private:
    external: true
