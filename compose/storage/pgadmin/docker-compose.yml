---
name: pgadmin
services:
  pgadmin:
    image: dpage/pgadmin4:9.11.0
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    volumes:
      - ${VOLUMES_PATH:-../../../.volumes}/storage/pgadmin/data:/var/lib/pgadmin
      - ./server.json:/pgadmin4/servers.json
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    networks:
      - n8n-starter-public
      - n8n-starter-private
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/misc/ping" ]
      start_interval: 5s
      start_period: 2m
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true

networks:
  n8n-starter-public:
    external: true
  n8n-starter-private:
    external: true
