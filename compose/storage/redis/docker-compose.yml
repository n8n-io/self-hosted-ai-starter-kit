name: redis
services:
  redis:
    image: redis:8-alpine
    volumes:
      - ${VOLUMES_PATH:-../../../.volumes}/storage/redis/data:/data
    ports:
      - '0.0.0.0:6379:6379'
    networks:
      - n8n-starter-private
    restart: on-failure
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  n8n-starter-private:
    external: true
