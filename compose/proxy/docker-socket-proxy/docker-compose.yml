---
name: docker-socket-proxy
services:
  docker-socket-proxy:
    image: linuxserver/socket-proxy:3.2.10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - POST=0
      - LOG_LEVEL=notice
    networks:
      - n8n-starter-private
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:2375/_ping" ]
      start_interval: 2s
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /run

networks:
  n8n-starter-private:
    external: true
